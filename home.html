<!DOCTYPE html>
<html language="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favorite Singers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <!-- Bootstrap grid containing the image and singer table -->
    <div class="container py-4">
        <h1 class="text-center mb-4">My Favorite Singers</h1>

        <div class="row g-4">
            
            <!-- Responsive music-themed image -->
            <div class="col-sm-4">
                <img src="images/MixedGenreImage.jpg"
                    class="img-fluid rounded"
                    alt="Music themed image with words of various genres of music in different fonts and colors">
            </div>
  
            <!-- Bootstrap table for singer information -->
            <div class="col-sm-8">
                
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Singer</th>
                            <th scope="col">Best Song</th>
                            <th scope="col">Date of Birth</th>
                        </tr>
                    </thead>

                    <!-- Table rows are populated by main.js -->
                    <tbody id="singerTableBody">
                    
                    </tbody>
                </table>

            </div>

        </div>
    </div>

<script src="js/main.js"></script>

</body>

</html>
